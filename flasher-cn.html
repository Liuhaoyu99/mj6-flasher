<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小米温湿度计 3 mini · 固件刷写工具</title>
<style>
:root{
  --bg:#0b0e13; --surface:#12161f; --surface-2:#1a1f2b; --line:#242b39;
  --txt:#e8ecf3; --txt-2:#9aa5b8; --txt-3:#6b7789;
  --brand:#3d7eff; --brand-2:#5c93ff; --ok:#2ecc8f; --warn:#f5b942; --err:#ff5c5c;
  --radius:14px; --shadow:0 8px 28px rgba(0,0,0,.45);
  color-scheme: dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1100px 500px at 50% -180px, rgba(61,126,255,.18), transparent 70%),
    var(--bg);
  color:var(--txt);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh; padding:0 0 96px;
}
.wrap{max-width:860px;margin:0 auto;padding:0 16px;}

/* ---------- 顶部 ---------- */
header{padding:22px 0 18px;}
.brand{display:flex;align-items:center;gap:12px;}
.logo{
  width:40px;height:40px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--brand),#7aa7ff);
  display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff;
  box-shadow:0 6px 18px rgba(61,126,255,.35);
}
.brand h1{font-size:19px;margin:0;font-weight:650;letter-spacing:.3px;}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--txt-3);}

/* ---------- 卡片 ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin:14px 0;box-shadow:var(--shadow);
}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.step{
  width:24px;height:24px;border-radius:8px;flex:none;
  background:var(--surface-2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--txt-2);
}
.card-head h2{font-size:15.5px;margin:0;font-weight:600;}
.card-head .hint{margin-left:auto;font-size:12px;color:var(--txt-3);}
.card.is-done .step{background:rgba(46,204,143,.15);border-color:rgba(46,204,143,.4);color:var(--ok);}

/* ---------- 按钮 ---------- */
.btn{
  appearance:none;border:1px solid var(--line);background:var(--surface-2);color:var(--txt);
  border-radius:11px;padding:11px 18px;font-size:14.5px;font-weight:550;font-family:inherit;
  cursor:pointer;transition:transform .12s, background .15s, border-color .15s, opacity .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:hover:not(:disabled){background:#222a39;border-color:#313b4d;}
.btn:active:not(:disabled){transform:scale(.975);}
.btn:disabled{opacity:.42;cursor:not-allowed;}
.btn-primary{
  background:linear-gradient(180deg,var(--brand-2),var(--brand));
  border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(61,126,255,.3);
}
.btn-primary:hover:not(:disabled){background:linear-gradient(180deg,#6b9dff,#2f6ff0);}
.btn-danger{background:rgba(255,92,92,.12);border-color:rgba(255,92,92,.35);color:#ff8a8a;}
.btn-danger:hover:not(:disabled){background:rgba(255,92,92,.2);}
.btn-ghost{background:transparent;}
.btn-block{width:100%;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}

/* ---------- 状态徽章 ---------- */
.badge{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:550;
  background:var(--surface-2);border:1px solid var(--line);color:var(--txt-2);
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--txt-3);flex:none;}
.badge.on{color:#7ef0bf;border-color:rgba(46,204,143,.35);background:rgba(46,204,143,.1);}
.badge.on .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(46,204,143,.18);animation:pulse 1.8s infinite;}
.badge.busy{color:#ffd98a;border-color:rgba(245,185,66,.35);background:rgba(245,185,66,.1);}
.badge.busy .dot{background:var(--warn);}
.badge.err{color:#ff9b9b;border-color:rgba(255,92,92,.35);background:rgba(255,92,92,.1);}
.badge.err .dot{background:var(--err);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ---------- 设备信息 ---------- */
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.kv-item{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:10px 13px;}
.kv-item .k{font-size:11.5px;color:var(--txt-3);letter-spacing:.3px;}
.kv-item .v{font-size:14px;font-weight:600;margin-top:2px;word-break:break-all;}
.kv-item .v.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;}

/* ---------- 进度 ---------- */
.progress-wrap{margin-top:4px;}
.progress-track{
  height:10px;background:#0a0d12;border-radius:999px;overflow:hidden;
  border:1px solid var(--line);position:relative;
}
.progress-fill{
  height:100%;width:0%;border-radius:999px;
  background:linear-gradient(90deg,var(--brand),#7fb0ff);
  transition:width .22s ease;
}
.progress-fill.ok{background:linear-gradient(90deg,var(--ok),#63e0b0);}
.progress-fill.err{background:linear-gradient(90deg,var(--err),#ff8f8f);}
.progress-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;color:var(--txt-2);}
.progress-meta .pct{font-weight:650;color:var(--txt);font-variant-numeric:tabular-nums;}

/* ---------- 日志 ---------- */
.log{
  background:#080a0e;border:1px solid var(--line);border-radius:12px;
  max-height:290px;overflow-y:auto;padding:12px 14px;
  font:12.5px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace;
  color:#a9b4c6;
}
.log:empty::before{content:"日志将显示在这里…";color:var(--txt-3);font-family:inherit;}
.log .row{display:flex;gap:9px;padding:1px 0;}
.log .t{color:#4d5a70;flex:none;}
.log .m{white-space:pre-wrap;word-break:break-word;}
.log .m.ok{color:#7ef0bf;}
.log .m.err{color:#ff9b9b;}
.log .m.warn{color:#ffd98a;}

/* ---------- 文件选择 ---------- */
.file-picker{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:14px;
}
.file-picker.active{border-color:rgba(61,126,255,.5);background:rgba(61,126,255,.06);}
.file-meta{font-size:12.5px;color:var(--txt-2);}
.file-meta b{color:var(--txt);}

/* ---------- 提示条 ---------- */
.note{
  display:flex;gap:10px;padding:12px 14px;border-radius:11px;font-size:13px;line-height:1.6;
  background:rgba(61,126,255,.08);border:1px solid rgba(61,126,255,.22);color:#bcd0f5;
}
.note.warn{background:rgba(245,185,66,.08);border-color:rgba(245,185,66,.25);color:#f3d79a;}
.note.danger{background:rgba(255,92,92,.08);border-color:rgba(255,92,92,.25);color:#ffb3b3;}
.note.icon{flex:none;}

/* ---------- 折叠 ---------- */
details.adv{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);overflow:hidden;}
details.adv > summary{
  list-style:none;cursor:pointer;padding:12px 15px;font-size:13.5px;font-weight:550;color:var(--txt-2);
  display:flex;align-items:center;gap:8px;user-select:none;
}
details.adv > summary::-webkit-details-marker{display:none;}
details.adv > summary::after{content:"›";margin-left:auto;transition:transform .2s;color:var(--txt-3);}
details.adv[open] > summary::after{transform:rotate(90deg);}
details.adv .adv-body{padding:0 15px 15px;border-top:1px solid var(--line);}

/* ---------- 开关 ---------- */
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;}
.switch-row .lbl{font-size:13.5px;color:var(--txt-2);}
.switch{position:relative;width:46px;height:27px;flex:none;}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2;}
.switch .track{
  position:absolute;inset:0;border-radius:999px;background:#2a3242;
  border:1px solid var(--line);transition:background .18s,border-color .18s;
}
.switch .knob{
  position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
  background:#8d99ac;transition:transform .18s,background .18s;
}
.switch input:checked ~ .track{background:rgba(61,126,255,.32);border-color:rgba(61,126,255,.55);}
.switch input:checked ~ .knob{transform:translateX(19px);background:var(--brand-2);}

/* ---------- 底部 ---------- */
footer{padding:26px 0 10px;text-align:center;font-size:12px;color:var(--txt-3);}
footer a{color:var(--txt-2);text-decoration:none;}
footer a:hover{color:var(--brand-2);}
@media (max-width:560px){
  .brand h1{font-size:17px;}
  .card{padding:15px;}
  .btn{padding:12px 16px;font-size:15px;}
  .progress-meta{font-size:12px;}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo">MJ</div>
      <div>
        <h1>小米温湿度计 3 mini</h1>
        <p>MJWSD06MMC · 固件刷写工具</p>
      </div>
    </div>
  </header>

  <!-- 1 连接 -->
  <section class="card" id="card-connect">
    <div class="card-head">
      <div class="step">1</div>
      <h2>连接设备</h2>
      <span class="badge" id="conn-badge"><span class="dot"></span><span id="conn-text">未连接</span></span>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-connect" onclick="uiConnect()">搜索并连接</button>
      <button class="btn" id="btn-disconnect" onclick="uiDisconnect()" disabled>断开</button>
      <button class="btn btn-ghost" id="btn-reconnect" onclick="uiReconnect()" disabled>重新连接</button>
    </div>
  </section>

  <!-- 2 设备信息 -->
  <section class="card" id="card-info" hidden>
    <div class="card-head">
      <div class="step">2</div>
      <h2>设备信息</h2>
    </div>
    <div class="kv">
      <div class="kv-item"><div class="k">设备名称</div><div class="v" id="info-name">—</div></div>
      <div class="kv-item"><div class="k">MAC 地址</div><div class="v mono" id="info-mac">—</div></div>
      <div class="kv-item"><div class="k">固件版本</div><div class="v" id="info-ver">—</div></div>
      <div class="kv-item"><div class="k">硬件版本</div><div class="v" id="info-hw">—</div></div>
    </div>
  </section>

  <!-- 3 选择固件 -->
  <section class="card" id="card-file">
    <div class="card-head">
      <div class="step">3</div>
      <h2>选择固件</h2>
    </div>
    <div class="file-picker" id="file-picker">
      <button class="btn" id="btn-pick" onclick="document.getElementById('file').click()">选择固件文件</button>
      <div class="file-meta" id="file-meta">支持 .bin / .zigbee，未选择</div>
      <input type="file" id="file" accept=".bin,.zigbee" hidden onchange="uiFileChosen(this)">
    </div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn btn-ghost" onclick="uiLoadBuiltin('MJ6_v59_clock.bin')">载入自定义固件 v21</button>
      <button class="btn btn-ghost" onclick="uiLoadBuiltin('MJ6_v59_official.bin')">载入官方原版（救砖）</button>
    </div>
  </section>

  <!-- 4 刷写 -->
  <section class="card" id="card-flash">
    <div class="card-head">
      <div class="step">4</div>
      <h2>刷写固件</h2>
    </div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="prog-fill"></div></div>
      <div class="progress-meta">
        <span id="prog-text">等待开始</span>
        <span class="pct" id="prog-pct">0%</span>
      </div>
    </div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn btn-primary btn-block" id="btn-flash" onclick="uiStartFlash()" disabled>开始刷写</button>
    </div>
    <div class="note warn" style="margin-top:12px" id="flash-note">
      <span class="icon">!</span>
      <span>刷写过程中请保持设备靠近、不要关闭页面。一旦中断，需要重新连接并从头开始——Telink OTA 无法中途续传。</span>
    </div>
  </section>

  <!-- 5 日志 -->
  <section class="card" id="card-log">
    <div class="card-head">
      <div class="step">·</div>
      <h2>运行日志</h2>
      <button class="btn btn-ghost" style="margin-left:auto;padding:6px 12px;font-size:12.5px" onclick="uiClearLog()">清空</button>
    </div>
    <div class="log" id="log"></div>
  </section>

  <!-- 高级 -->
  <section class="card">
    <details class="adv">
      <summary>高级设置</summary>
      <div class="adv-body">
        <div class="switch-row">
          <span class="lbl">显示广播 MAC（实验性）</span>
          <label class="switch"><input type="checkbox" id="opt-advmac"><span class="track"></span><span class="knob"></span></label>
        </div>
        <div class="switch-row">
          <span class="lbl">刷写后自动断开</span>
          <label class="switch"><input type="checkbox" id="opt-autodis" checked><span class="track"></span><span class="knob"></span></label>
        </div>
        <div style="margin-top:12px">
          <button class="btn btn-danger btn-block" onclick="uiFactoryReset()">恢复设备出厂设置</button>
        </div>
      </div>
    </details>
  </section>

  <footer>
    基于 <a href="https://github.com/pvvx/ATC_MiThermometer" target="_blank" rel="noopener">pvvx/ATC_MiThermometer</a> ·
    界面重制版 · 仅用于 MJWSD06MMC
  </footer>
</div>

<script src="./core.js"></script>
<script>
/* =========================================================================
 * MJ6 刷机界面 —— 模块化实现
 * 说明：OTA 协议部分直接沿用 pvvx 的 Telink 实现（block 32B + CRC16 + 状态回读），
 *      这里重写的是「交互层」：连接流程、状态机、进度、日志、模块化 UI。
 * ========================================================================= */
'use strict';

/* ------------------------- 1. 常量与状态 ------------------------- */
const OTA_SVC_UUID   = '00010203-0405-0607-0809-0a0b0c0d1912';
const OTA_CHR_UUID   = '00010203-0405-0607-0809-0a0b0c0d2b12';
const MAX_OTA_SIZE   = 0x20000;      // 128 KB
const BLOCK_SIZE     = 32;           // 每块 32 字节
const STATUS_EVERY   = 32;           // 每 32 块回读一次状态（1 KB）

const State = {
  device: null,
  server: null,
  otaChar: null,
  fileData: null,
  fileName: '',
  blockCount: 0,
  busy: false,
  flashing: false,
  lastBlock: 0,
  startTime: 0
};

/* ------------------------- 2. 工具函数 ------------------------- */
const $ = (id) => document.getElementById(id);

function log(msg, kind) {
  const box = $('log');
  const row = document.createElement('div');
  row.className = 'row';
  const t = new Date();
  const hh = String(t.getHours()).padStart(2,'0');
  const mm = String(t.getMinutes()).padStart(2,'0');
  const ss = String(t.getSeconds()).padStart(2,'0');
  row.innerHTML = '<span class="t">' + hh + ':' + mm + ':' + ss + '</span>' +
                  '<span class="m ' + (kind || '') + '"></span>';
  row.querySelector('.m').textContent = msg;
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}
function uiClearLog(){ $('log').innerHTML = ''; }

function hexToBytes(hex){
  const out = new Uint8Array(hex.length >> 1);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i*2, 2), 16);
  return out;
}
function bytesToHex(bytes){
  return Array.from(new Uint8Array(bytes)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function crc16modbus(bytes){
  let crc = 0xFFFF;
  for (let i = 0; i < bytes.length; i++){
    crc ^= bytes[i];
    for (let j = 0; j < 8; j++){
      const odd = crc & 1;
      crc >>= 1;
      if (odd) crc ^= 0xA001;
    }
  }
  return crc;
}
function le16(v){ return String.fromCharCode(v & 0xFF, (v >> 8) & 0xFF); }
function hex2(n, w){ return n.toString(16).padStart(w || 2, '0'); }

/* ------------------------- 3. 界面状态机 ------------------------- */
const UI = {
  setBadge(text, cls){
    const b = $('conn-badge');
    b.className = 'badge' + (cls ? ' ' + cls : '');
    $('conn-text').textContent = text;
  },
  connected(name){
    this.setBadge('已连接', 'on');
    $('btn-connect').disabled = true;
    $('btn-disconnect').disabled = false;
    $('btn-reconnect').disabled = false;
    $('card-info').hidden = false;
    $('info-name').textContent = name || '—';
  },
  disconnected(){
    this.setBadge('未连接', '');
    $('btn-connect').disabled = false;
    $('btn-disconnect').disabled = true;
    $('btn-reconnect').disabled = true;
    this.updateFlashButton();
  },
  busyState(on){
    State.busy = on;
    if (on) this.setBadge('连接中…', 'busy');
  },
  progress(pct, text){
    $('prog-fill').style.width = Math.max(0, Math.min(100, pct)) + '%';
    $('prog-pct').textContent = pct.toFixed(1) + '%';
    if (text) $('prog-text').textContent = text;
  },
  progressClass(cls){
    $('prog-fill').className = 'progress-fill' + (cls ? ' ' + cls : '');
  },
  file(name, size){
    $('file-meta').innerHTML = '已选择：<b>' + name + '</b> · ' + (size/1024).toFixed(1) + ' KB';
    $('file-picker').classList.add('active');
    this.updateFlashButton();
  },
  updateFlashButton(){
    $('btn-flash').disabled = !(State.otaChar && State.fileData && !State.flashing);
  }
};

/* ------------------------- 4. 连接管理 ------------------------- */
const Conn = {
  async requestDevice(){
    const options = {
      acceptAllDevices: true,
      optionalServices: [
        OTA_SVC_UUID,
        '00001f10-0000-1000-8000-00805f9b34fb',
        '0000180a-0000-1000-8000-00805f9b34fb',
        0x181a, 0xfe95, 0xfcd2
      ]
    };
    const namePrefix = '';
    if (namePrefix) { options.acceptAllDevices = false; options.filters = [{ namePrefix }]; }
    return navigator.bluetooth.requestDevice(options);
  },

  async connect(device){
    State.device = device;
    device.addEventListener('gattserverdisconnected', Conn.onDrop);
    const server = await device.gatt.connect();
    State.server = server;
    const services = await server.getPrimaryServices();
    let otaSvc = null;
    for (const s of services) if (s.uuid === OTA_SVC_UUID) otaSvc = s;
    if (!otaSvc) throw new Error('该设备没有 Telink OTA 服务，可能不是兼容固件');
    State.otaChar = await otaSvc.getCharacteristic(OTA_CHR_UUID);
    return device;
  },

  onDrop(){
    State.otaChar = null;
    State.server = null;
    UI.disconnected();
    if (State.flashing){
      const pct = State.blockCount ? State.lastBlock / State.blockCount * 100 : 0;
      log('连接中断（' + pct.toFixed(0) + '%），请重新连接后再次刷写', 'err');
      UI.progress(pct, '已中断');
      UI.progressClass('err');
      State.flashing = false;
      UI.updateFlashButton();
    } else {
      log('设备已断开', 'warn');
    }
  }
};

async function uiConnect(){
  if (!navigator.bluetooth){
    log('当前浏览器不支持 Web Bluetooth，请使用 Chrome / Edge', 'err');
    alert('请使用 Chrome 或 Edge 浏览器打开本页面');
    return;
  }
  UI.busyState(true);
  try {
    log('正在搜索设备…');
    const device = await Conn.requestDevice();
    log('已选择：' + (device.name || '(未命名)') + '，正在连接…');
    await Conn.connect(device);
    UI.connected(device.name);
    log('连接成功', 'ok');
    await Info.load();
  } catch (e){
    UI.setBadge('连接失败', 'err');
    log('连接失败：' + (e.message || e), 'err');
  } finally {
    UI.busyState(false);
    UI.updateFlashButton();
  }
}

function uiDisconnect(){
  if (State.device && State.device.gatt.connected) State.device.gatt.disconnect();
  UI.disconnected();
  log('已主动断开');
}
async function uiReconnect(){
  if (!State.device) return;
  UI.busyState(true);
  try {
    await Conn.connect(State.device);
    UI.connected(State.device.name);
    log('重新连接成功', 'ok');
  } catch (e){
    log('重连失败：' + (e.message || e), 'err');
  } finally { UI.busyState(false); }
}

/* ------------------------- 5. 设备信息 ------------------------- */
const Info = {
  async load(){
    const name = State.device ? State.device.name : '';
    $('info-name').textContent = name || '—';
    try {
      const services = await State.server.getPrimaryServices();
      let devInfo = null;
      for (const s of services) if (s.uuid === '0000180a-0000-1000-8000-00805f9b34fb') devInfo = s;
      if (devInfo){
        const chars = await devInfo.getCharacteristics();
        for (const c of chars){
          try {
            const v = await c.readValue();
            const txt = new TextDecoder().decode(v).replace(/\0/g,'').trim();
            if (/firmware/i.test(c.uuid)) $('info-ver').textContent = txt;
            if (/hardware/i.test(c.uuid)) $('info-hw').textContent = txt;
          } catch(_){}
        }
      }
    } catch(_){}
    if (/^[0-9A-F]{12}$/i.test(name.replace(/[:,]/g,'')))
      $('info-mac').textContent = name.replace(/[:,]/g,'').match(/.{2}/g).join(':').toUpperCase();
  }
};

/* ------------------------- 6. 固件文件 ------------------------- */
async function uiFileChosen(input){
  const f = input.files && input.files[0];
  if (!f) return;
  const buf = await f.arrayBuffer();
  uiSetFirmware(f.name, new Uint8Array(buf));
}
async function uiLoadBuiltin(name){
  try {
    log('正在载入 ' + name + ' …');
    const r = await fetch('./' + name);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const buf = await r.arrayBuffer();
    uiSetFirmware(name, new Uint8Array(buf));
    log('已载入 ' + name, 'ok');
  } catch(e){
    log('载入失败：' + (e.message || e) + '（请先手动选择文件）', 'err');
  }
}
function uiSetFirmware(name, data){
  if (data.length > MAX_OTA_SIZE){
    log('固件过大：' + data.length + ' 字节，超过 OTA 上限 128 KB', 'err');
    return;
  }
  State.fileData = data;
  State.fileName = name;
  /* pvvx rounds up: a trailing partial block is still sent, padded to 32 bytes.
     Using ceil() here (and zero-padding the chunk) reproduces that exactly. */
  State.blockCount = Math.ceil(data.length / BLOCK_SIZE);
  UI.file(name, data.length);
  UI.progress(0, '已就绪，可以开始');
  UI.progressClass('');
  log('固件：' + name + '，' + data.length + ' 字节，共 ' + State.blockCount + ' 块');
}

/* ------------------------- 7. 刷写核心 ------------------------- */
async function otaSend(hex){
  const payload = hexToBytes(hex);
  const ch = State.otaChar;
  if (!ch) throw new Error('未连接');
  try {
    if (ch.writeValueWithoutResponse) await ch.writeValueWithoutResponse(payload);
    else await ch.writeValue(payload);
  } catch(e){
    await ch.writeValue(payload);   // 回退到带确认写
  }
}

function makeBlock(n){
  const start = n * BLOCK_SIZE;
  const raw = State.fileData.subarray(start, Math.min(start + BLOCK_SIZE, State.fileData.length));
  /* Always send a full 32-byte payload: a short trailing block would desynchronise the
   * device's block counter. Unused bytes are 0xFF (erased-flash value), matching pvvx. */
  const body = new Uint8Array(2 + BLOCK_SIZE);
  body[0] = n & 0xFF;
  body[1] = (n >> 8) & 0xFF;
  body.set(raw, 2);
  if (raw.length < BLOCK_SIZE) body.fill(0xFF, 2 + raw.length);
  const crc = crc16modbus(body);
  // 头部小端 + 32 字节数据 + CRC 小端
  return bytesToHex(body) + hex2(crc & 0xFF) + hex2((crc >> 8) & 0xFF);
}

async function uiStartFlash(){
  if (!State.fileData || !State.otaChar) return;
  State.flashing = true;
  State.lastBlock = 0;
  State.startTime = Date.now();
  UI.updateFlashButton();
  UI.progress(0, '正在初始化…');
  UI.progressClass('');
  log('开始刷写：' + State.fileName + '（' + State.blockCount + ' 块）');

  try {
    await otaSend('00ff');
    await otaSend('01ff');
    await new Promise(r => setTimeout(r, 250));
    await flashBlock(0);
  } catch(e){
    State.flashing = false;
    UI.updateFlashButton();
    UI.progressClass('err');
    UI.progress(State.blockCount ? State.lastBlock / State.blockCount * 100 : 0, '刷写失败');
    log('刷写失败：' + (e.message || e), 'err');
  }
}

async function flashBlock(n){
  if (n >= State.blockCount){
    await finishFlash();
    return;
  }
  State.lastBlock = n;
  const pct = n / State.blockCount * 100;
  if ((n & 15) === 0){
    const sec = ((Date.now() - State.startTime) / 1000).toFixed(1);
    UI.progress(pct, '已发送 ' + n + ' / ' + State.blockCount + ' 块 · ' + sec + ' 秒');
  }
  await otaSend(makeBlock(n));

  if ((n + 1) % STATUS_EVERY === 0){
    const v = await State.otaChar.readValue();
    if (v.byteLength > 0){
      const code = v.getUint8(0);
      if (code !== 0){
        await finishWithError(code);
        return;
      }
    }
  }
  setTimeout(() => flashBlock(n + 1), 0);
}

async function finishFlash(){
  const last = State.blockCount - 1;
  const inv = (~last) & 0xFFFF;
  const cmd = '02ff' + hex2(last & 0xFF) + hex2((last >> 8) & 0xFF) +
                        hex2(inv & 0xFF) + hex2((inv >> 8) & 0xFF);
  await otaSend(cmd);
  State.flashing = false;
  UI.updateFlashButton();
  UI.progress(100, '刷写完成');
  UI.progressClass('ok');
  const sec = ((Date.now() - State.startTime) / 1000).toFixed(1);
  log('刷写完成，用时 ' + sec + ' 秒。设备将自动重启。', 'ok');
  if ($('opt-autodis').checked) setTimeout(() => uiDisconnect(), 1500);
}

const OTA_ERRORS = ['成功','数据包丢失','数据 CRC 错误','写入 Flash 失败','尾部数据包丢失','超时','固件 CRC 校验失败'];
async function finishWithError(code){
  State.flashing = false;
  UI.updateFlashButton();
  UI.progressClass('err');
  UI.progress(State.lastBlock / State.blockCount * 100, '出错');
  const msg = OTA_ERRORS[code] || ('未知错误 ' + code);
  log('设备回报错误：' + msg, 'err');
}

function uiFactoryReset(){
  if (!confirm('确定要恢复出厂设置吗？设备将重启并清除自定义配置。')) return;
  if (!State.otaChar) { log('请先连接设备', 'err'); return; }
  log('正在恢复出厂设置…');
  otaSend('DE').then(() => log('已发送恢复指令', 'ok'))
                  .catch(e => log('恢复失败：' + e, 'err'));
}

/* ------------------------- 8. 初始化 ------------------------- */
window.addEventListener('load', () => {
  log('页面已就绪，请点击「搜索并连接」开始');
  if (!navigator.bluetooth){
    log('此浏览器不支持 Web Bluetooth，请改用 Chrome / Edge', 'err');
    $('btn-connect').disabled = true;
  }
  UI.progress(0, '等待开始');
});
</script>
